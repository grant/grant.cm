name: test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Detect visual-test changes
        id: visual-changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            required:
              - '.github/workflows/test.yaml'
              - 'frontend/components/**'
              - 'frontend/data/**'
              - 'frontend/e2e/**'
              - 'frontend/pages/**'
              - 'frontend/public/**'
              - 'frontend/styles/**'
              - 'frontend/next.config.*'
              - 'frontend/package.json'
              - 'frontend/playwright.config.ts'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/postcss.config.*'
              - 'frontend/tailwind.config.*'
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Test frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test
      - name: Install Chromium
        if: steps.visual-changes.outputs.required == 'true'
        run: cd frontend && pnpm exec playwright install --with-deps chromium
      - name: Test visual baselines
        if: steps.visual-changes.outputs.required == 'true'
        run: cd frontend && pnpm test:visual
      - name: Upload visual diff
        if: failure() && steps.visual-changes.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-diff
          path: frontend/test-results/
          if-no-files-found: ignore
